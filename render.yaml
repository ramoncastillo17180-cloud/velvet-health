# Velvet Health — Render Blueprint
# Provisiona: base PostgreSQL + API (Node) + sitio estático (React) en un solo paso.
# Uso: Render Dashboard → New → Blueprint → seleccionar el repo.

databases:
  - name: velvet-db
    plan: free
    databaseName: velvet_health
    user: velvet

services:
  # --- Backend API (Express + TS + Prisma) ---
  - type: web
    name: velvet-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx prisma db seed && npm run prisma:seed-admin && npm start
    healthCheckPath: /api/courses
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velvet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: ramoncastillo17180@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NOMBRE
        value: Ramon
      - key: ADMIN_APELLIDOS
        value: Castillo
      - key: EMAIL_MODE
        value: console
      - key: DOCUMENT_STORAGE
        value: local

  # --- Frontend (React + Vite, sitio estático) ---
  - type: web
    name: velvet-web
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://velvet-api-u3z6.onrender.com/api
