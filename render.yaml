# Velvet Health — Render Blueprint
# Provisiona: base PostgreSQL + API (Node) + sitio estático (React) en un solo paso.
# Uso: Render Dashboard → New → Blueprint → seleccionar el repo.

databases:
  - name: velvet-db
    plan: free
    databaseName: velvet_health
    user: velvet

services:
  # --- Backend API (Express + TS + Prisma) ---
  - type: web
    name: velvet-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx prisma db seed && npm start
    healthCheckPath: /api/courses
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velvet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # --- Frontend (React + Vite, sitio estático) ---
  - type: web
    name: velvet-web
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://velvet-api.onrender.com/api
