<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Inicia sesión</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body style="padding:2rem;">
<h2>Inicia sesión</h2>
<form id="loginForm">
  <input id="nombreInput" placeholder="Nombre" required style="padding:0.5rem;margin-bottom:1rem;display:block;" />
  <button style="padding:0.6rem 1rem;">Entrar</button>
</form>

<script>
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault()
    const nombre = document.getElementById('nombreInput').value
    localStorage.setItem('nombre_usuario', nombre)
    window.location.href = 'index.html'
  })
</script>
</body>
</html>
