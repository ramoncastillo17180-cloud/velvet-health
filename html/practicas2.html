<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet Health - Cursos</title>
  <link rel="stylesheet" href="practicas.css">
</head>
<body>
  <header>
    <nav class="top-nav">
      <button class="menu-button">☰</button>
      <h1 >Velvet Health</h1>
      <div class="profile">Mi Perfil</div>
    </nav>
    <div class="logo" >
      <img src="logo2.png">
    </div>
  </header>

  <main>
    <section class="filter-bar">
      <h2>Cursos</h2>
      <div class="filters">
        <button class="filter">Efectos</button>
        <button class="filter">A-Z</button>
        <button class="filter">Lista Previa</button>
      </div>
    </section>

    <section class="courses">
      <div class="course-card">
        <img src="reanimacion.png" alt="Reanimación Cardiopulmonar">
        <h3>Reanimación Cardiopulmonar</h3>
        <p class="duration">20 Minutos</p>
        <p class="desc">Útil en Paro cardiaco y respiratorio.</p>
        <button class="start-button">Iniciar</button>
      </div>

      <div class="course-card">
        <img src="heimich.png" alt="Maniobra de Heimlich">
        <h3>Maniobra de Heimlich</h3>
        <p class="duration">15 Minutos</p>
        <p> Útil en Atragantamiento por objeto o comida.</p>
        <button class="start-button">Iniciar</button>
      </div>

      <div class="course-card">
        <img src="hemorragia.png" alt="Detener Hemorragias">
        <h3>Maniobra de para detener Hemorragias</h3>
        <p class="duration">60 Minutos</p>
        <p class="desc">Útil en Sangrados externos.</p>
        <button class="start-button">Iniciar</button>
      </div>
    </section>
  </main>

  <footer>
    <a href="#">Conócenos</a>
    <a href="#">Contacto</a>
  </footer>
</body>
</html>
